<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5efe5;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #254957;
    }
    .stage {
      width: min(1100px, 100%);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(36, 73, 87, .14);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(38, 64, 70, .18);
      background: #a9dbe4;
    }
    svg { display: block; width: 100%; height: auto; }
    .caption {
      position: absolute; left: 26px; top: 22px;
      padding: 10px 14px; border-radius: 14px;
      background: rgba(255,255,255,.66); backdrop-filter: blur(8px);
      font-size: 13px; letter-spacing: .08em; font-weight: 700;
      color: #305b67;
    }
    .caption span { display: block; margin-top: 3px; font-size: 22px; letter-spacing: 0; color: #183c48; }
    button {
      position: absolute; right: 24px; top: 22px; cursor: pointer;
      border: 0; border-radius: 999px; padding: 10px 15px;
      background: #fef7e8; color: #315a64; font-weight: 700;
      box-shadow: 0 5px 16px rgba(23, 58, 66, .15);
    }
    button:hover { background: white; }
    .paused * { animation-play-state: paused !important; }

    .cloud { animation: drift 28s linear infinite; }
    .cloud.slow { animation-duration: 38s; animation-delay: -16s; }
    .sun-glow { animation: breathe 4s ease-in-out infinite; transform-origin: 805px 110px; }
    .bike-group { animation: cruise 2.2s ease-in-out infinite; transform-origin: 500px 420px; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.05s linear infinite; }
    .pedal { transform-box: fill-box; transform-origin: center; animation: spin 1.05s linear infinite; }
    .leg-a { transform-box: fill-box; transform-origin: 492px 365px; animation: pedalA 1.05s ease-in-out infinite; }
    .leg-b { transform-box: fill-box; transform-origin: 520px 365px; animation: pedalB 1.05s ease-in-out infinite; }
    .wing { transform-box: fill-box; transform-origin: 500px 280px; animation: flap 1.05s ease-in-out infinite; }
    .head { animation: headBob 2.2s ease-in-out infinite; }
    .shadow { animation: shadow 2.2s ease-in-out infinite; transform-origin: center; }
    .road-dash { animation: road 1.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drift { from { transform: translateX(-150px); } to { transform: translateX(1050px); } }
    @keyframes breathe { 50% { transform: scale(1.08); opacity: .78; } }
    @keyframes cruise { 0%,100% { transform: translateY(0) rotate(-.5deg); } 50% { transform: translateY(-4px) rotate(.5deg); } }
    @keyframes pedalA { 0%,100% { transform: rotate(18deg); } 50% { transform: rotate(-34deg); } }
    @keyframes pedalB { 0%,100% { transform: rotate(-34deg); } 50% { transform: rotate(18deg); } }
    @keyframes flap { 0%,100% { transform: rotate(2deg); } 50% { transform: rotate(-10deg) translateY(-3px); } }
    @keyframes headBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .25; } 50% { transform: scaleX(.92); opacity: .18; } }
    @keyframes road { to { transform: translateX(-120px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="caption">A LITTLE RIDE<span>鹈鹕出发啦！</span></div>
    <button id="toggle" type="button" aria-pressed="false">暂停动画</button>
    <svg viewBox="0 0 1000 650" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
      <title id="title">一只鹈鹕骑着自行车沿海边前进</title>
      <desc id="desc">扁平插画风格的海边道路，鹈鹕踩着自行车踏板，车轮、翅膀、云朵和道路标线持续运动。</desc>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9bd7e1"/><stop offset="1" stop-color="#d9f0ea"/></linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#65b9c6"/><stop offset="1" stop-color="#3d91a5"/></linearGradient>
        <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f9d99d"/><stop offset="1" stop-color="#e8b977"/></linearGradient>
        <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
      </defs>
      <rect width="1000" height="650" fill="url(#sky)"/>
      <g class="sun-glow"><circle cx="805" cy="110" r="70" fill="#ffd77d" opacity=".23" filter="url(#blur)"/><circle cx="805" cy="110" r="43" fill="#ffd77d"/><circle cx="792" cy="97" r="8" fill="#ffeab1" opacity=".6"/></g>
      <g class="cloud" fill="#fffdf5" opacity=".82"><path d="M55 160c12-24 44-27 59-8 12-34 65-37 79 4 22-9 48 6 49 31H37c0-15 5-23 18-27z"/><path d="M630 200c10-20 37-23 51-6 10-29 54-32 66 4 19-8 41 5 42 27H615c0-12 5-20 15-25z"/></g>
      <g class="cloud slow" fill="#fffdf5" opacity=".55"><path d="M320 95c9-19 33-21 45-5 9-25 47-27 57 4 16-6 35 5 36 23H305c0-10 5-17 15-22z"/></g>
      <path d="M0 336c112-38 212-32 313 1 98 32 188 32 279 2 112-37 236-31 408 8v150H0z" fill="url(#sea)"/>
      <path d="M0 374c124-24 217-11 322 16 106 27 198 18 293-5 115-28 228-24 385 15v77H0z" fill="#bce8df" opacity=".5"/>
      <path d="M0 462c174-26 302-17 435 8 150 28 301 24 565-17v197H0z" fill="url(#sand)"/>
      <path d="M0 535c207-34 356-24 502 4 157 31 297 22 498-16v127H0z" fill="#374e59"/>
      <g class="road-dash" fill="#f7d58d" opacity=".95"><rect x="25" y="585" width="100" height="10" rx="5"/><rect x="205" y="585" width="100" height="10" rx="5"/><rect x="385" y="585" width="100" height="10" rx="5"/><rect x="565" y="585" width="100" height="10" rx="5"/><rect x="745" y="585" width="100" height="10" rx="5"/><rect x="925" y="585" width="100" height="10" rx="5"/></g>
      <g class="shadow" fill="#183a42"><ellipse cx="500" cy="537" rx="191" ry="17"/></g>

      <g class="bike-group">
        <!-- bicycle -->
        <g fill="none" stroke="#d75d4b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
          <circle class="wheel" cx="388" cy="468" r="62" stroke="#264e58" stroke-width="7" fill="#7dc7cd" fill-opacity=".15"/>
          <circle class="wheel" cx="625" cy="468" r="62" stroke="#264e58" stroke-width="7" fill="#7dc7cd" fill-opacity=".15"/>
          <path d="M388 468l74-105 86 105-160 0 74-105 49 0"/>
          <path d="M548 468l77-105 27 0"/>
          <path d="M462 363l-14-26M625 363l-8-30M611 333h33"/>
        </g>
        <g stroke="#d75d4b" stroke-width="6" stroke-linecap="round"><path d="M458 467l34-12"/><path d="M458 467l-16 27"/></g>
        <g class="pedal" fill="none" stroke="#264e58" stroke-width="5"><circle cx="458" cy="467" r="18"/><path d="M458 449v-19M458 485v19"/><path d="M447 428h-16M469 504h16"/></g>

        <!-- pelican -->
        <g>
          <path d="M472 374c-12-35-3-78 25-104 25-24 63-29 86-5 18 19 21 53 3 75-18 22-46 29-71 22l-17 31z" fill="#f4eee0" stroke="#244b56" stroke-width="6"/>
          <path d="M506 281c-13-44 2-77 37-91 35-15 72 5 83 39 10 31-6 63-34 78-25 14-64 10-86-26z" fill="#f8f1e4" stroke="#244b56" stroke-width="6"/>
          <path class="head" d="M557 204c22-21 63-20 82 4 14 18 10 42-9 55-17 12-40 7-54-6l-29 16c-17 9-35-4-28-21z" fill="#f8f1e4" stroke="#244b56" stroke-width="6"/>
          <path d="M622 223c37-9 75 0 117 17-34 20-73 26-115 9z" fill="#eaa36b" stroke="#244b56" stroke-width="6"/>
          <path d="M636 249c26 7 56 5 83-3-22 23-59 31-82 17z" fill="#dc7b60" opacity=".95"/>
          <circle cx="610" cy="220" r="6" fill="#244b56"/><circle cx="612" cy="218" r="2" fill="#fff"/>
          <path d="M572 195l7-25 10 24" fill="#e9b56f" stroke="#244b56" stroke-width="5"/>
          <!-- wing -->
          <path class="wing" d="M491 286c-54 4-89 32-106 72 41 7 85-5 119-34 14-12 13-35-13-38z" fill="#d6e0d7" stroke="#244b56" stroke-width="6"/>
          <path d="M402 352c34-5 61-17 87-38M419 362c32-4 54-14 77-29" fill="none" stroke="#a9c5c0" stroke-width="5" stroke-linecap="round"/>
          <path d="M490 366c19 10 36 10 51-2" fill="none" stroke="#244b56" stroke-width="6" stroke-linecap="round"/>
          <!-- feet and legs -->
          <g fill="none" stroke="#e28a52" stroke-width="8" stroke-linecap="round"><path class="leg-a" d="M493 365v54l-31 47"/><path class="leg-b" d="M522 362v57l32 47"/></g>
          <g fill="#e28a52" stroke="#244b56" stroke-width="4"><ellipse cx="458" cy="469" rx="20" ry="8" transform="rotate(-23 458 469)"/><ellipse cx="556" cy="469" rx="20" ry="8" transform="rotate(23 556 469)"/></g>
        </g>
      </g>
      <g fill="#fef7e8" opacity=".8"><circle cx="115" cy="430" r="4"/><circle cx="146" cy="415" r="3"/><circle cx="865" cy="421" r="4"/><circle cx="895" cy="405" r="2.5"/></g>
    </svg>
  </main>
  <script>
    const stage = document.getElementById('stage');
    const toggle = document.getElementById('toggle');
    toggle.addEventListener('click', () => {
      const paused = stage.classList.toggle('paused');
      toggle.textContent = paused ? '继续动画' : '暂停动画';
      toggle.setAttribute('aria-pressed', String(paused));
    });
  </script>
</body>
</html>
