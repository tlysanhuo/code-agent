<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车</title>
<style>
  :root { --sky:#9bdcf5; --sand:#f7d79c; --ink:#243447; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(#bdeafa,#eefaff); font-family:system-ui,sans-serif; }
  .stage { width:min(960px,96vw); aspect-ratio:16/9; overflow:hidden; border:5px solid #fff; border-radius:24px; box-shadow:0 18px 50px #3d789944; background:var(--sky); }
  svg { width:100%; height:100%; display:block; }
  .wheel { transform-box:fill-box; transform-origin:center; animation:spin 1.1s linear infinite; }
  .bike { animation:ride 2.2s ease-in-out infinite; transform-origin:center bottom; }
  .pedal { transform-box:fill-box; transform-origin:center; animation:spin 1.1s linear infinite reverse; }
  .pelican { animation:bob .55s ease-in-out infinite alternate; transform-origin:center bottom; }
  .wing { animation:flap .8s ease-in-out infinite alternate; transform-origin:12px 18px; }
  .cloud { animation:float 18s linear infinite; }
  .cloud.two { animation-duration:24s; animation-delay:-9s; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes ride { 0%,100% { transform:translateX(-8px) rotate(-1deg); } 50% { transform:translateX(8px) rotate(1deg); } }
  @keyframes bob { from { transform:translateY(0) rotate(-1deg); } to { transform:translateY(-5px) rotate(1deg); } }
  @keyframes flap { from { transform:rotate(4deg); } to { transform:rotate(-18deg); } }
  @keyframes float { from { transform:translateX(-160px); } to { transform:translateX(980px); } }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 960 540" role="img" aria-label="一只鹈鹕骑着自行车的2D动画">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#74cbe8"/><stop offset="1" stop-color="#3a9bc4"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="960" height="540" fill="#9bdcf5"/>
  <circle cx="790" cy="100" r="54" fill="#ffe9a6" opacity=".9"/>
  <g class="cloud" fill="#fff" opacity=".8"><ellipse cx="90" cy="115" rx="52" ry="20"/><ellipse cx="135" cy="105" rx="38" ry="28"/><ellipse cx="178" cy="117" rx="55" ry="19"/></g>
  <g class="cloud two" fill="#fff" opacity=".65"><ellipse cx="420" cy="72" rx="45" ry="16"/><ellipse cx="460" cy="66" rx="30" ry="24"/><ellipse cx="498" cy="74" rx="42" ry="15"/></g>
  <path d="M0 330 Q190 285 380 330 T760 325 T960 320 V540 H0Z" fill="url(#water)"/>
  <path d="M0 420 Q220 380 430 420 T960 410 V540 H0Z" fill="#f7d79c"/>
  <path d="M0 458 Q230 430 460 462 T960 452" fill="none" stroke="#d7ad66" stroke-width="7" opacity=".65"/>
  <ellipse cx="480" cy="444" rx="180" ry="18" fill="#24485d" opacity=".2" filter="url(#shadow)"/>
  <g class="bike" stroke="#243447" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g class="wheel"><circle cx="375" cy="405" r="58" stroke="#324b5e"/><circle cx="375" cy="405" r="7" fill="#324b5e" stroke="none"/><path d="M375 347v116M317 405h116M334 364l82 82M416 364l-82 82" stroke-width="3" opacity=".6"/></g>
    <g class="wheel"><circle cx="605" cy="405" r="58" stroke="#324b5e"/><circle cx="605" cy="405" r="7" fill="#324b5e" stroke="none"/><path d="M605 347v116M547 405h116M564 364l82 82M646 364l-82 82" stroke-width="3" opacity=".6"/></g>
    <path d="M375 405 L430 325 L540 405 L375 405 M430 325 L470 405 M540 405 L525 315 L575 315" stroke="#e85d4a"/>
    <path d="M510 300h70" stroke="#e85d4a"/><path d="M430 325h-28"/>
    <g class="pedal"><circle cx="470" cy="405" r="13" stroke="#e85d4a"/><path d="M470 405l28-20M470 405l-25 18" stroke="#e85d4a"/></g>
  </g>
  <g class="pelican">
    <ellipse cx="474" cy="268" rx="61" ry="78" fill="#f6f3e9" stroke="#243447" stroke-width="7"/>
    <path class="wing" d="M447 238 Q400 265 432 323 Q455 342 475 309 Q463 275 447 238Z" fill="#dce5e5" stroke="#243447" stroke-width="7"/>
    <path d="M485 202 Q510 162 557 188 Q582 203 560 226 L514 250Z" fill="#f6f3e9" stroke="#243447" stroke-width="7"/>
    <circle cx="532" cy="195" r="7" fill="#243447"/>
    <path d="M555 215 Q635 217 646 242 Q635 267 555 248 Q525 237 555 215Z" fill="#f2a65a" stroke="#243447" stroke-width="7"/>
    <path d="M575 239 Q620 252 642 244" fill="none" stroke="#c9773c" stroke-width="4"/>
    <path d="M455 336 L445 395 M493 336 L505 395" stroke="#e78c35" stroke-width="10"/>
    <path d="M436 393h24 M497 393h23" stroke="#243447" stroke-width="7"/>
    <path d="M454 192 Q430 174 416 184" fill="none" stroke="#243447" stroke-width="7"/>
  </g>
  <text x="36" y="500" fill="#fff" font-size="22" font-weight="700" opacity=".9">Pelican Pedal Parade</text>
</svg>
</div>
</body>
</html>
